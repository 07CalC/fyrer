[package]
name = "fyrer-cache"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Cache providers for fyrer"
repository.workspace = true

[dependencies]
fyrer-core = { path = "../fyrer-core" }
anyhow = "1.0"
tokio = { version = "1.30", features = ["full"] }
blake3 = "1.8.6"
tar = "0.4.46"
zstd = "0.13.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
glob = "0.3.4"
tempfile = "3.27.0"
