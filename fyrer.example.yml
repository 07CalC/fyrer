version: 1
env:
  LOG_LEVEL: info
  NODE_ENV: development
packages:
  - name: web
    root: ./apps/web
    env:
      PORT: "3000"
      API_URL: "http://localhost:8080"
    env_file: .env
    tasks:
      dev:
        cmd: bun run dev
        inputs:
          - src/**
          - public/**
          - package.json
          - next.config.ts
        depends_on:
          - ui:build
        ignore:
          - node_modules/**
          - .next/**
        cache: false
      build:
        cmd: bun run build
        depends_on:
          - ui:build
        inputs:
          - src/**
          - public/**
          - package.json
          - next.config.ts
        outputs:
          - .next/**
        ignore:
          - node_modules/**
        cache: true
  - name: ui
    root: ./packages/ui
    env:
      NODE_ENV: production
    env_file: .env.production
    tasks:
      build:
        cmd: bun run build
        inputs:
          - src/**
          - package.json
          - tsconfig.json
        outputs:
          - dist/**
        ignore:
          - node_modules/**
        cache: true
      dev:
        cmd: bun run dev
        inputs:
          - src/**
        ignore:
          - node_modules/**
          - dist/**
        cache: false
  - name: api
    root: ./apps/api
    env:
      RUST_LOG: debug
    env_file: .env
    tasks:
      build:
        cmd: cargo build --release
        inputs:
          - src/**
          - Cargo.toml
          - Cargo.lock
        outputs:
          - target/release/api
        ignore:
          - target/**
        cache: true
      dev:
        cmd: cargo watch -x run
        inputs:
          - src/**
        ignore:
          - target/**
        cache: false
