name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest

          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm

          - name: windows-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest

          - name: windows-arm64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm

          - name: macos-x64
            target: x86_64-apple-darwin
            os: macos-15

          - name: macos-arm64
            target: aarch64-apple-darwin
            os: macos-15

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: endsWith(matrix.target, '-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

      - name: Package
        shell: bash
        run: |
          mkdir dist

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/fyrer.exe" \
               "dist/fyrer-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/fyrer" \
               "dist/fyrer-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          for asset in fyrer-*; do
            sha256sum "$asset" > "$asset.sha256"
          done

      - name: Validate release assets
        working-directory: dist
        run: |
          expected=(
            fyrer-x86_64-unknown-linux-musl
            fyrer-aarch64-unknown-linux-musl
            fyrer-x86_64-pc-windows-msvc.exe
            fyrer-aarch64-pc-windows-msvc.exe
            fyrer-x86_64-apple-darwin
            fyrer-aarch64-apple-darwin
          )

          for asset in "${expected[@]}"; do
            test -f "$asset"
            test -f "$asset.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Publish Cargo
        run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify npm package version
        working-directory: npm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(node -p 'require("./package.json").version')" = "${RELEASE_TAG#v}"

      - name: Publish npm
        working-directory: npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
