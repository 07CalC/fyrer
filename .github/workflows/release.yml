name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest

          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest

          - name: windows-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest

          - name: windows-arm64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm

          - name: macos-x64
            target: x86_64-apple-darwin
            os: macos-15

          - name: macos-arm64
            target: aarch64-apple-darwin
            os: macos-15

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir dist

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/fyrer.exe" \
               "dist/fyrer-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/fyrer" \
               "dist/fyrer-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Publish Cargo
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
