name: Release

# Releases are driven by merges to main. Nothing ships unless the workspace
# version was bumped — the version in [workspace.package].version (root
# Cargo.toml) is the single source of truth. To cut a release:
#
#   cargo xtask bump 0.5.1   # bumps Cargo.toml + npm/package.json
#   git commit -m "chore: release v0.5.1" && open/merge PR
#
# On merge, this workflow builds all targets and publishes to crates.io
# and GitHub Releases. If tag v<version> already exists, it no-ops.
# npm publishing is currently disabled (not yet supported).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "fyrer") | .version')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            echo "v${VERSION} is already released, skipping"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing v${VERSION}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest

          - name: linux-arm64
            target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm

          - name: windows-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest

          - name: windows-arm64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm

          - name: macos-x64
            target: x86_64-apple-darwin
            os: macos-15

          - name: macos-arm64
            target: aarch64-apple-darwin
            os: macos-15

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: endsWith(matrix.target, '-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p fyrer
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

      - name: Package
        shell: bash
        run: |
          mkdir dist

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "target/${{ matrix.target }}/release/fyrer.exe" \
               "dist/fyrer-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/fyrer" \
               "dist/fyrer-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          for asset in fyrer-*; do
            sha256sum "$asset" > "$asset.sha256"
          done

      - name: Validate release assets
        working-directory: dist
        run: |
          expected=(
            fyrer-x86_64-unknown-linux-musl
            fyrer-aarch64-unknown-linux-musl
            fyrer-x86_64-pc-windows-msvc.exe
            fyrer-aarch64-pc-windows-msvc.exe
            fyrer-x86_64-apple-darwin
            fyrer-aarch64-apple-darwin
          )

          for asset in "${expected[@]}"; do
            test -f "$asset"
            test -f "$asset.sha256"
          done

      # Publishes every micro-crate fyrer depends on first (in dependency
      # order) and `fyrer` itself last; skips crates already on crates.io.
      # The micro-crates must exist on the registry because they are
      # dependencies of the published fyrer crate.
      - name: Publish to crates.io
        run: cargo run --quiet -p xtask -- publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # npm publishing disabled — not yet supported
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #     registry-url: https://registry.npmjs.org
      #
      # - name: Verify npm package version
      #   working-directory: npm
      #   env:
      #     VERSION: ${{ needs.version.outputs.version }}
      #   run: |
      #     test "$(node -p 'require("./package.json").version')" = "${VERSION}"
      #
      # - name: Publish npm
      #   working-directory: npm
      #   run: npm publish
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Created last so a failed publish never leaves a blocking v<version>
      # tag behind; the next main push retries cleanly.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: dist/*
