[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Calc <hello@vinm.me>"]
license = "MIT"
repository = "https://github.com/07calc/fyrer"

# Internal crates: path + version so `cargo publish` works against crates.io
# (path-only dependencies are rejected when publishing).
[workspace.dependencies]
fyrer-core = { path = "crates/fyrer-core" }
fyrer-process = { path = "crates/fyrer-process" }
fyrer-log = { path = "crates/fyrer-log" }
fyrer-config = { path = "crates/fyrer-config" }
fyrer-cache = { path = "crates/fyrer-cache" }
fyrer-engine = { path = "crates/fyrer-engine" }
fyrer-watch = { path = "crates/fyrer-watch" }
fyrer-ui = { path = "crates/fyrer-ui" }

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
