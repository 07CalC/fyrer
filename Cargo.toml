[package]
name = "fyrer"
version = "0.3.3"
edition = "2024"
authors = ["Calc <hello@vinm.me>"]
license = "MIT"
description = "A lightweight declarative language agnostic monorepo tool / task orchestrator"
repository = "https://github.com/07calc/fyrer"
readme = "README.md"
keywords = ["monorepo", "task-runner", "dev-server", "concurrency", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
blake3 = "1.8.6"
chrono = "0.4.45"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
glob = "0.3.4"
humantime-serde = "1.1.1"
libc = "0.2"
owo-colors = "4.3.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "1.0"
tokio = { version = "1.30", features = ["full"] }
zstd = "0.13.3"

[lints.clippy]
all = "warn"
pedantic = "warn"
