[package]
name = "fyrer"
version = "0.3.0"
edition = "2024"
authors = ["Calc <hello@vinm.me>"]
license = "MIT"
description = "A declarative, fast and lightweight monorepo tool"
repository = "https://github.com/07calc/fyrer"
readme = "README.md"
keywords = ["monorepo", "task-runner", "dev-server", "concurrency", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
blake3 = "1.8.6"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6.5"
colored = "3.1.1"
crossterm = "0.29.0"
futures = "0.3.33"
glob = "0.3.4"
libc = "0.2"
notify = "8.2.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
tar = "0.4.46"
thiserror = "1.0"
tokio = { version = "1.30", features = ["full"] }
walkdir = "2.5.0"
zip = "8.6.0"
zstd = "0.13.3"

[lints.clippy]
all = "warn"
pedantic = "warn"
